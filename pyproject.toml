[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gamspytimes"
version = "0.1.0"
readme = "README.md"
description = "Migration of TIMES to GAMSPy"
requires-python = ">=3.13"
dependencies = [
  "gamspy",
  "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
  "pytest",
  "coverage>=6.0",
]

docs = [
    "jupyter"
]

dev = [
    "pre-commit",
    "detect-secrets",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
addopts = "--junitxml=junit-report.xml"
junit_family = "xunit2"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.'MASTER']
init-hook = 'import sys; sys.path.append("src")'

[tool.ruff]
line-length = 88
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
warn_unused_configs = true
follow_imports = "skip"
follow_imports_for_stubs = true
disable_error_code = ["misc", "import-untyped"]
