repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-ast
      - id: check-merge-conflict
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "detect-secrets"
        args: [ "--baseline", ".secrets.baseline", "--exclude-files", ".*\\.ipynb$" ]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # Run the linter
      - id: ruff
        args: [ --fix ]
      # Run the formatter
      - id: ruff-format
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: [ "--profile", "black" ]
  # fails if uv.lock is out of sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  # mypy runs in the project's uv environment, so its version and the
  # gamspy/pandas-stubs/pydantic it type-checks against all come from uv.lock
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        files: "^src\\/core\\/(.*?)$"
        args: ["--config-file=pyproject.toml"]
        require_serial: true
      # audits the exact versions pinned in uv.lock (all groups and extras)
      - id: uv-audit
        name: uv audit
        entry: uv audit --frozen --preview-features audit-command
        language: system
        pass_filenames: false
        always_run: true
        stages: [ manual ]
